# Reference Apache vhost for paystubissa.com on the shared Hostinger VPS.
# This is the :80 vhost. certbot --apache generates the matching :443 vhost
# (paystubissa.com-le-ssl.conf) by cloning these directives and adds the
# HTTP->HTTPS redirect.
#
# Prereqs before the ProxyPass lines are valid:
#   a2enmod proxy proxy_http rewrite headers
#   (Node service must be running on 127.0.0.1:4000 — Phase 1)
#
# Phase 0 (static + TLS only): deploy WITHOUT the "Backend API" block below,
# then add it in Phase 1 once the Node service exists.

<VirtualHost *:80>
    ServerAdmin webmaster@paystubissa.com
    ServerName paystubissa.com
    ServerAlias www.paystubissa.com
    DocumentRoot /var/www/paystubissa.com

    # --- React SPA: serve build files, fall back to index.html for client-side routes ---
    <Directory /var/www/paystubissa.com>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # --- Backend API: reverse-proxy to the Node service (localhost only) [PHASE 1] ---
    # /api is matched here during URL mapping, so it never hits the filesystem or
    # the SPA FallbackResource above.
    ProxyPreserveHost On
    ProxyPass        /api  http://127.0.0.1:4000/api
    ProxyPassReverse /api  http://127.0.0.1:4000/api

    ErrorLog ${APACHE_LOG_DIR}/paystubissa.com.error.log
    CustomLog ${APACHE_LOG_DIR}/paystubissa.com.access.log combined
</VirtualHost>
