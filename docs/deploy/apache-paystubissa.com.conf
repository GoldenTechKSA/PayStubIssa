# Apache vhost for paystubissa.com — this is the plain :80 site config.
#
# This file is ADDITIVE: it defines its own ServerName + DocumentRoot and does
# not touch any other site on the VPS. Install it as
#   /etc/apache2/sites-available/paystubissa.com.conf
# then `a2ensite paystubissa.com.conf`, `apache2ctl configtest`, and reload.
#
# TLS: run `certbot --apache -d paystubissa.com -d www.paystubissa.com`. Certbot
# clones these directives into paystubissa.com-le-ssl.conf (the :443 vhost) and
# adds the HTTP->HTTPS redirect here. Do not hand-edit the -le-ssl file.

<VirtualHost *:80>
    ServerName paystubissa.com
    ServerAlias www.paystubissa.com
    ServerAdmin webmaster@paystubissa.com
    DocumentRoot /var/www/paystubissa.com

    # React SPA: serve the built files, and fall back to index.html for any
    # path that is not a real file so client-side (React Router) deep links work.
    <Directory /var/www/paystubissa.com>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # --- Node backend [OPTIONAL / LATER] ---------------------------------------
    # Uncomment ONLY once the Node service is running on 127.0.0.1:4000. First:
    #   a2enmod proxy proxy_http
    # /api is matched here during URL mapping so it never hits the SPA fallback.
    #
    # ProxyPreserveHost On
    # ProxyPass        /api  http://127.0.0.1:4000/api
    # ProxyPassReverse /api  http://127.0.0.1:4000/api
    # ---------------------------------------------------------------------------

    ErrorLog  ${APACHE_LOG_DIR}/paystubissa.com.error.log
    CustomLog ${APACHE_LOG_DIR}/paystubissa.com.access.log combined
</VirtualHost>
