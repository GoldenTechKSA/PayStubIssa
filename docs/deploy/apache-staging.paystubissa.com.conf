# Apache vhost for staging.paystubissa.com — plain :80 config, same shape as the
# production vhost but with its own docroot so staging can run a different build.
#
# ADDITIVE: defines only its own ServerName + DocumentRoot; touches no other site.
# Install as /etc/apache2/sites-available/staging.paystubissa.com.conf, then
#   a2ensite staging.paystubissa.com.conf && apache2ctl configtest && systemctl reload apache2
#
# TLS: `certbot --apache -d staging.paystubissa.com` (after the DNS A record resolves).
# Certbot writes staging.paystubissa.com-le-ssl.conf itself. The ONLY hand edit that
# file needs is the same `Include` line as below (see docs/deploy/BACKEND-DEPLOY.md).

<VirtualHost *:80>
    ServerName staging.paystubissa.com
    ServerAdmin webmaster@paystubissa.com
    DocumentRoot /var/www/staging.paystubissa.com

    # Keep search engines off the staging copy.
    Header set X-Robots-Tag "noindex, nofollow"

    <Directory /var/www/staging.paystubissa.com>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # --- Node backend (staging instance) ----------------------------------------
    # PM2 process `paystub-api-staging` on 127.0.0.1:4001 with PayPal SANDBOX
    # credentials, so a staging test can never charge a real card. The proxy
    # directives live in one include so the :80 and :443 vhosts stay identical.
    # Requires: a2enmod proxy proxy_http headers
    Include /etc/apache2/sites-available/paystubissa-api-staging.inc
    # ---------------------------------------------------------------------------

    ErrorLog  ${APACHE_LOG_DIR}/staging.paystubissa.com.error.log
    CustomLog ${APACHE_LOG_DIR}/staging.paystubissa.com.access.log combined
</VirtualHost>
