name: Deploy to VPS

# Fires on every push to master. A merged PR to master IS a push to master,
# so this runs automatically on each merge. workflow_dispatch lets you also
# trigger a manual re-deploy from the Actions tab.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys run at once; queue them instead of racing on the docroot.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Non-secret target coordinates. Only the SSH private key and the pinned host
# key are stored as GitHub secrets. See docs/deploy/DEPLOYMENT.md for setup.
# Verify SSH_HOST matches this VPS's current public IP before the first run.
env:
  SSH_HOST: "82.180.161.18"
  SSH_USER: "paystubissa"
  SSH_PORT: "22"
  DEPLOY_PATH: "/var/www/paystubissa.com"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        # Non-watch, don't fail if a folder has no tests yet.
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: "true"

      - name: Build
        # CI=false so ESLint *warnings* don't get promoted to errors and block a deploy.
        run: npm run build
        env:
          CI: "false"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy build/ to Apache docroot
        run: |
          rsync -rlvz --checksum --delete \
            --chmod=D755,F644 \
            --exclude='.well-known' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            build/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://paystubissa.com/)
          echo "Homepage returned HTTP $code"
          test "$code" = "200"
