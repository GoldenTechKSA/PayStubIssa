name: Deploy to VPS

# Fires on every push to master. A merged PR to master IS a push to master,
# so this runs automatically on each merge. workflow_dispatch lets you also
# trigger a manual re-deploy from the Actions tab.
#
# Deploys BOTH halves of the site: the Node API (PM2 `paystub-api`, live
# PayPal, 127.0.0.1:4000) first, then the static client. The API must be up
# before a client build that calls /api is served. One-time VPS setup is in
# docs/deploy/BACKEND-DEPLOY.md.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys run at once; queue them instead of racing on the docroot.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Non-secret target coordinates. Only the SSH private key is stored as a GitHub
# secret. See docs/deploy/DEPLOYMENT.md for setup.
# Verify SSH_HOST matches this VPS's current public IP before the first run.
env:
  SSH_HOST: "82.180.161.18"
  SSH_USER: "paystubissa"
  SSH_PORT: "22"
  # Static client build → Apache docroot.
  DEPLOY_PATH: "/var/www/paystubissa.com"
  # Node API → inside the deploy user's home, so no sudo is needed to deploy.
  API_PATH: "/home/paystubissa/apps/production/server"
  PM2_APP: "paystub-api"
  SITE_URL: "https://paystubissa.com"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # ---- Client -----------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      - name: Test
        # Non-watch, don't fail if a folder has no tests yet.
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: "true"

      - name: Build
        # CI=false so ESLint *warnings* don't get promoted to errors and block a deploy.
        run: npm run build
        env:
          CI: "false"

      # ---- Server -----------------------------------------------------------
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Test server
        run: npm test
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      # ---- Ship -------------------------------------------------------------
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy API (compiled) and restart PM2
        # Only what the runtime needs goes over: dist/, the manifests and the PM2
        # file. `.env` and `data/` (the sales ledger) live on the VPS and are never
        # touched. Production deps are installed on the VPS so the native
        # better-sqlite3 binary matches the server's Node.
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$API_PATH'"
          rsync -avz --delete \
            --exclude '.env' --exclude 'data/' --exclude 'node_modules/' \
            -e "$SSH" \
            server/dist server/package.json server/package-lock.json server/ecosystem.config.cjs \
            "$SSH_USER@$SSH_HOST:$API_PATH/"
          $SSH "$SSH_USER@$SSH_HOST" bash -s <<EOF
            set -euo pipefail
            cd '$API_PATH'
            test -f .env || { echo "::error::$API_PATH/.env is missing on the VPS (see docs/deploy/BACKEND-DEPLOY.md)"; exit 1; }
            npm ci --omit=dev --no-audit --no-fund
            pm2 startOrReload ecosystem.config.cjs --only '$PM2_APP' --update-env
            pm2 save
          EOF

      - name: Verify API before publishing the client
        # Refuse to ship a client that calls /api if the API is not answering as LIVE.
        run: |
          for i in 1 2 3 4 5 6; do
            health=$(curl -s -m 10 "$SITE_URL/api/health" || true)
            echo "$health" | grep -q '"ok":true' && break
            sleep 5
          done
          echo "Health: $health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"paypalEnv":"live"'

      - name: Deploy build/ to Apache docroot
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" \
            build/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/")
          echo "Homepage returned HTTP $code"
          test "$code" = "200"
          curl -s "$SITE_URL/api/payments/config" | grep -q '"paypalEnv":"live"'
